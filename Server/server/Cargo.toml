[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
exchange = { path = "../../Exchange/exchange" }
orderbook = { path = "../../Orderbook/orderbook" }
actors = { path = "../../Actors/actors" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["small_rng"] }